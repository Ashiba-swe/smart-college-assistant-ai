{% extends "base.html" %}

{% block title %}My Profile - Smart College Assistant AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-saas p-4 p-md-5 border">
                <div class="d-flex align-items-center mb-4">
                    <div class="stat-badge bg-navy text-white me-3" style="width: 54px; height: 54px; font-size: 24px;">
                        <i class="bi bi-person"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-dark mb-0">{{ current_user.full_name }}</h3>
                        <span class="badge bg-teal-subtle text-teal">{{ current_user.role }}</span>
                        <span class="text-muted small ms-2">Member since {{ current_user.created_at.strftime('%b %Y') }}</span>
                    </div>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Username</label>
                            <input type="text" class="form-control bg-light" value="{{ current_user.username }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <input type="email" class="form-control bg-light" value="{{ current_user.email }}" disabled>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ current_user.department or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Roll / Employee ID</label>
                            <input type="text" name="roll_number" class="form-control" value="{{ current_user.roll_number or '' }}">
                        </div>
                    </div>

                    <div class="mb-4 pt-3 border-top">
                        <h6 class="fw-bold text-dark mb-2">Change Password</h6>
                        <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password">
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Save Profile Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
