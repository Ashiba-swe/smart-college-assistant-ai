{% extends "base.html" %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5" style="max-width: 500px; margin: 0 auto;">
        <div class="stat-badge bg-danger-subtle text-danger mx-auto mb-3" style="width: 72px; height: 72px; font-size: 36px;">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">500 - Server Encountered an Issue</h2>
        <p class="text-muted mb-4">
            An internal server error occurred. Our engineers and administrators have been notified via audit logs.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-teal px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
