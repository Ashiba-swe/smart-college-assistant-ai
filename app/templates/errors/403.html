{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5" style="max-width: 500px; margin: 0 auto;">
        <div class="stat-badge bg-danger-subtle text-danger mx-auto mb-3" style="width: 72px; height: 72px; font-size: 36px;">
            <i class="bi bi-shield-x"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">403 - Access Forbidden</h2>
        <p class="text-muted mb-4">
            You do not have the required role permissions to view this resource. Contact an administrator if you believe this is an error.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-teal px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
