{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5" style="max-width: 500px; margin: 0 auto;">
        <div class="stat-badge bg-warning-subtle text-warning mx-auto mb-3" style="width: 72px; height: 72px; font-size: 36px;">
            <i class="bi bi-compass"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">
            The page or document source you are looking for does not exist or may have been relocated.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-teal px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
