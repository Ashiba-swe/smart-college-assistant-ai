{% extends "base.html" %}

{% block title %}Submit FAQ - Faculty Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-saas p-4 p-md-5 border">
                <div class="mb-4">
                    <a href="{{ url_for('faculty.dashboard') }}" class="text-teal small text-decoration-none fw-semibold">
                        <i class="bi bi-arrow-left"></i> Back to Faculty Desk
                    </a>
                    <h3 class="fw-bold text-dark mt-2">Submit Departmental FAQ</h3>
                    <p class="text-muted small">Provide clear, authoritative answers to recurring student questions.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Student Question *</label>
                        <input type="text" name="question" class="form-control" placeholder="e.g. When will the 6th semester lab mini-project viva be held?" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Category</label>
                            <select name="category" class="form-select">
                                <option value="Academic Regulations">Academic Regulations</option>
                                <option value="Examinations">Examinations</option>
                                <option value="Departmental Notices" selected>Departmental Notices</option>
                                <option value="Laboratories & Safety">Laboratories & Safety</option>
                                <option value="Internship & Placements">Internship & Placements</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ current_user.department }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Official Verified Answer *</label>
                        <textarea name="answer" class="form-control" rows="4" placeholder="State the exact verified departmental policy or date..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 shadow-sm">
                        <i class="bi bi-send me-1"></i> Submit FAQ for Verification
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
