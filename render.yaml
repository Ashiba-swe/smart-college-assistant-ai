services:
  # Web Application Service
  - type: web
    name: smart-college-assistant-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/seed_database.py
    startCommand: gunicorn "app:create_app('production')" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    disk:
      name: college-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-college-db
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma_db
      - key: UPLOAD_FOLDER
        value: /data/uploads

# Managed PostgreSQL Database
databases:
  - name: smart-college-db
    plan: free
    region: oregon
    databaseName: college_assistant
    user: college_admin
